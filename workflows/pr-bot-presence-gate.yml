name: pr-bot-presence-gate

# Advisory-only compatibility workflow. Keep disabled in repository Actions
# settings unless an owner explicitly dispatches it and opts into reviewers.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  bot-presence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install gh CLI
        run: |
          type -p curl >/dev/null || sudo apt install curl -y
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y
      - name: Optional reviewer presence check
        env:
          PR: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
          BOT_WAIT_REQUIRED: ${{ vars.BOT_WAIT_REQUIRED || 'off' }}
          BOT_WAIT_IGNORE_CHECK_NAMES: bot-presence-gate,pr-bot-feedback-check,required-bot-wait,qwen-code-review,cursor-auto-review
        run: |
          if [ "$BOT_WAIT_REQUIRED" = "off" ]; then
            echo "Reviewer presence is advisory; no vendors explicitly required."
            exit 0
          fi
          SCRIPT="${CURSOR_WORKFLOW_SCRIPTS:-./scripts}/wait_for_bots.mjs"
          node "$SCRIPT" --watch --pr "$PR"
