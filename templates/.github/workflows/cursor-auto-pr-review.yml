name: cursor-auto-pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

concurrency:
  group: qwen-code-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}-${{ github.event.pull_request.head.sha || github.run_id }}
  cancel-in-progress: true

jobs:
  qwen-code-review:
    name: qwen-code-review
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.pull_request != null
      || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && contains(github.event.comment.body, '@qwen-review'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve pull request metadata
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          INPUT_PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          FORCE_RERUN=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_NUMBER="$INPUT_PR"
            PR_JSON="$(gh pr view "$PR_NUMBER" --json headRefOid,baseRefName)"
            HEAD_SHA="$(printf '%s' "$PR_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).headRefOid));")"
            BASE_REF="$(printf '%s' "$PR_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).baseRefName));")"
            FORCE_RERUN=true
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            PR_NUMBER="$ISSUE_NUMBER"
            PR_JSON="$(gh pr view "$PR_NUMBER" --json headRefOid,baseRefName)"
            HEAD_SHA="$(printf '%s' "$PR_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).headRefOid));")"
            BASE_REF="$(printf '%s' "$PR_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).baseRefName));")"
            FORCE_RERUN=true
          else
            PR_NUMBER="$EVENT_PR"
            HEAD_SHA="$EVENT_HEAD_SHA"
            BASE_REF="$EVENT_BASE_REF"
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "force_rerun=$FORCE_RERUN" >> "$GITHUB_OUTPUT"

      - name: Gate exempt check
        id: gate_exempt
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -euo pipefail
          if [ "$PR_AUTHOR_TYPE" = "Bot" ] || [[ "$PR_AUTHOR" == *"[bot]" ]]; then
            echo "exempt=true" >> "$GITHUB_OUTPUT"
            echo "reason=bot-authored" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$PR_TITLE" | grep -qiE '^chore(\((deps|deps-dev|ci|bot|release)\)|:\s*(deps|dependabot|renovate|bot\b))'; then
            echo "exempt=true" >> "$GITHUB_OUTPUT"
            echo "reason=chore" >> "$GITHUB_OUTPUT"
          else
            echo "exempt=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if already reviewed for this commit
        id: already
        if: >-
          steps.gate_exempt.outputs.exempt != 'true'
          && steps.pr.outputs.force_rerun != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" --paginate \
            --jq '.check_runs[] | select(.name=="qwen-code-review" and .conclusion=="success") | .id' | head -n 1 || true)"
          if [ -n "$existing" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gate exempt or already reviewed — pass
        if: steps.gate_exempt.outputs.exempt == 'true' || steps.already.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          REASON: ${{ steps.gate_exempt.outputs.reason || 'already-reviewed' }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            --field name="qwen-code-review" \
            --field head_sha="$HEAD_SHA" \
            --field status="completed" \
            --field conclusion="success" \
            --field "output[title]=Qwen Code Review" \
            --field "output[summary]=Skipped ($REASON)." > /dev/null
          echo "qwen-code-review: skipped ($REASON)"

      - uses: actions/checkout@v4
        if: steps.gate_exempt.outputs.exempt != 'true' && steps.already.outputs.skip != 'true'
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.gate_exempt.outputs.exempt != 'true' && steps.already.outputs.skip != 'true'
        with:
          node-version: '20'

      - name: Run Qwen Code review
        id: review
        if: steps.gate_exempt.outputs.exempt != 'true' && steps.already.outputs.skip != 'true'
        env:
          QWEN_API_BASE_URL: ${{ secrets.QWEN_API_BASE_URL }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_MODEL: ${{ secrets.QWEN_MODEL }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          OUT_FILE: /tmp/qwen-review.txt
        run: |
          set -euo pipefail
          if [ -z "${QWEN_API_BASE_URL:-}" ]; then
            echo "QWEN_API_BASE_URL secret is missing. Set it to your reachable OpenAI-compatible base URL." > /tmp/qwen-review-error.txt
            echo "status=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${QWEN_MODEL:-}" ]; then
            export QWEN_MODEL="qwen3-coder:30b"
          fi
          REVIEW_SCRIPT="scripts/qwen-pr-review.mjs"
          if [ ! -f "$REVIEW_SCRIPT" ]; then
            echo "Missing $REVIEW_SCRIPT in the repository checkout." > /tmp/qwen-review-error.txt
            echo "status=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          node "$REVIEW_SCRIPT" > /tmp/qwen-review-stdout.txt 2> /tmp/qwen-review-error.txt
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "status=$status" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -s /tmp/qwen-review.txt ] && [ -s /tmp/qwen-review-stdout.txt ]; then
            cp /tmp/qwen-review-stdout.txt /tmp/qwen-review.txt
          fi
          if [ ! -s /tmp/qwen-review.txt ]; then
            echo "Qwen review completed without producing review output." > /tmp/qwen-review-error.txt
            echo "status=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "status=0" >> "$GITHUB_OUTPUT"

      - name: Post or update PR review comment
        if: always() && steps.gate_exempt.outputs.exempt != 'true' && steps.already.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REVIEW_STATUS: ${{ steps.review.outputs.status }}
        run: |
          set -euo pipefail
          {
            echo "<!-- qwen-code-review -->"
            echo "## Qwen Code Review"
            echo
            if [ "${REVIEW_STATUS:-1}" = "0" ]; then
              cat /tmp/qwen-review.txt
            else
              echo "Qwen Code review did not complete successfully."
              echo
              echo '```text'
              sed -e 's/\r$//' /tmp/qwen-review-error.txt
              echo '```'
            fi
          } > /tmp/qwen-review-comment.md

          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select((.body | contains("<!-- qwen-code-review -->")) or (.body | contains("<!-- cursor-auto-review -->"))) | .id' | tail -n 1 || true)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --field body=@/tmp/qwen-review-comment.md > /dev/null
          else
            gh pr comment "$PR_NUMBER" --body-file /tmp/qwen-review-comment.md
          fi

      - name: Publish qwen-code-review check
        if: always() && steps.gate_exempt.outputs.exempt != 'true' && steps.already.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_STATUS: ${{ steps.review.outputs.status }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          conclusion="success"
          summary="Qwen Code review completed and posted a PR comment."
          if [ "${REVIEW_STATUS:-1}" != "0" ]; then
            conclusion="failure"
            summary="Qwen Code review failed. See the PR comment and workflow logs."
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            --field name="qwen-code-review" \
            --field head_sha="$HEAD_SHA" \
            --field status="completed" \
            --field conclusion="$conclusion" \
            --field "output[title]=Qwen Code Review" \
            --field "output[summary]=$summary" > /dev/null
          if [ "$conclusion" != "success" ]; then
            exit 1
          fi
